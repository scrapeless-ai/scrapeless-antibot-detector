<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrapeless Antibot Detector</title>
  <link rel="stylesheet" href="presentation/foundations.css">
  <link rel="stylesheet" href="presentation/shell.css">
  <link rel="stylesheet" href="presentation/findings.css">
  <link rel="stylesheet" href="presentation/archive.css">

<body>
  <div id="app">
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <div class="logo-icon-wrapper">
            <img src="brand/toolbar-32.png" alt="Scrapeless" width="32" height="32" class="logo-icon">
          </div>
          <div class="logo-text">
            <span id="appBrand" data-i18n="extensionName">Scrapeless: anti-bot detector</span>
            <span id="appVersion" class="app-version"></span>
          </div>
        </div>
        <div class="header-controls">
          <div class="toggle-switch">
            <input type="checkbox" id="enableToggle" class="toggle-input" checked aria-label="Enable or disable detection" data-i18n-aria-label="enableOrDisableDetection">
            <label for="enableToggle" class="toggle-label">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <button id="settingsBtn" class="settings-btn" title="Settings" aria-label="Open settings" data-i18n-title="settings" data-i18n-aria-label="openSettings">

          <span data-i18n="tabRules">Detectors</span>
        </button>
        <!-- Opens the analytics board in its own tab. Deliberately carries no
             data-tab: it is not a pane the shell router switches to, and the
             router binds .tab-btn[data-tab] only. -->
        <button class="tab-btn tab-btn-away" id="analyticsLink" title="Open the analytics board" data-i18n-title="openAnalytics">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3,3H5V19H21V21H3V3M7,15H9V11H7V15M11,15H13V7H11V15M15,15H17V13H15V15Z" fill="currentColor"/>
          </svg>
          <span data-i18n="tabAnalytics">Analytics</span>
        </button>
      </nav>
    </header>

      <!-- History Tab -->
      <div id="historyTab" class="tab-content" style="display: none;">

      <div id="rulesTab" class="tab-content">
